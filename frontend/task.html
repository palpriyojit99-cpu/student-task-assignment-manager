<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Details | Student Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Task & Assignment Manager</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>


    <main>

        <section class="task-detail-section">

            <h2>Task Details</h2>

            <div class="task-detail">

                <h3 id="taskTitle">Physics Assignment</h3>

                <p>
                    <strong>Subject:</strong>
                    <span id="taskSubject">Physics</span>
                </p>

                <p>
                    <strong>Description:</strong>
                </p>

                <p id="taskDescription">
                    Complete the numerical problems from chapter 3.
                </p>

                <p>
                    <strong>Due Date:</strong>
                    <span id="taskDueDate">30 August 2026</span>
                </p>

                <p>
                    <strong>Priority:</strong>
                    <span id="taskPriority">High</span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="taskStatus">Pending</span>
                </p>

                <div class="task-actions">

                    <button id="completeTaskButton">
                        Mark as Complete
                    </button>

                    <button id="editTaskButton">
                        Edit Task
                    </button>

                    <button id="deleteTaskButton">
                        Delete Task
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="js/task.js"></script>

</body>

</html>
