<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task & Assignment Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Task & Assignment Manager</h1>
        <p>Manage your academic tasks in one place.</p>
    </header>

    <main>

        <section class="welcome-section">
            <h2>Welcome, Student!</h2>
            <p>Keep track of your assignments and upcoming tasks.</p>

            <button id="addTaskButton">Add New Task</button>
        </section>

        <section class="tasks-section">
            <h2>My Tasks</h2>

            <div id="taskList">
                <p>No tasks added yet.</p>
            </div>
        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
