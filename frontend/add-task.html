<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task | Student Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Task & Assignment Manager</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>


    <main>

        <section class="form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitleInput">Task Title</label>

                    <input
                        type="text"
                        id="taskTitleInput"
                        placeholder="Enter task title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="taskSubjectInput">Subject</label>

                    <input
                        type="text"
                        id="taskSubjectInput"
                        placeholder="Enter subject"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="taskDescriptionInput">
                        Description
                    </label>

                    <textarea
                        id="taskDescriptionInput"
                        placeholder="Describe the task"
                        rows="5"
                        required
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="taskDueDateInput">Due Date</label>

                    <input
                        type="date"
                        id="taskDueDateInput"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="taskPriorityInput">Priority</label>

                    <select id="taskPriorityInput">

                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>

                    </select>
                </div>


                <button type="submit">
                    Save Task
                </button>

                <button
                    type="button"
                    onclick="window.location.href='dashboard.html'"
                >
                    Cancel
                </button>

            </form>

        </section>

    </main>


    <script src="css/js/add-task.js"></script>

</body>

</html>
